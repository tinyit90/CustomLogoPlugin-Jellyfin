name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - jellyfin: 12.0.0
          - jellyfin: 10.11.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build
        run: |
          dotnet publish Jellyfin.Plugin.CustomLogo/Jellyfin.Plugin.CustomLogo.csproj \
            -c Release -o out -p:JellyfinVersion=${{ matrix.jellyfin }}
          python3 scripts/package.py --bin out --jellyfin ${{ matrix.jellyfin }} --version 2.0.0

      - uses: actions/upload-artifact@v4
        with:
          name: custom-logo-jellyfin-${{ matrix.jellyfin }}
          path: dist/*.zip
